<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Caja</title>
<style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#17202a}header{background:#1f2b3a;color:white;text-align:center;padding:30px}.box{max-width:900px;margin:30px auto;background:white;padding:28px;border-radius:14px}.products{display:flex;gap:16px}.p{flex:1;border:1px solid #ddd;border-radius:10px;padding:20px;text-align:center}button{background:#2867e8;color:#fff;border:0;border-radius:6px;padding:10px 16px;margin:4px}</style></head>
<body><header><h1>Sistema de Caja</h1><p>Infraestructura 2 - Práctica 3</p></header><div class="box"><h2>Productos</h2><div class="products"><div class="p"><h3>Café</h3><p>RD$ 100</p><button onclick="add(100)">Agregar</button></div><div class="p"><h3>Sandwich</h3><p>RD$ 250</p><button onclick="add(250)">Agregar</button></div><div class="p"><h3>Jugo</h3><p>RD$ 150</p><button onclick="add(150)">Agregar</button></div></div><h2>Total: RD$ <span id="total">0</span></h2><button onclick="alert('Venta procesada')">Procesar venta</button><button onclick="reset()">Nueva venta</button></div><script>let t=0;function add(x){t+=x;document.getElementById('total').textContent=t}function reset(){t=0;document.getElementById('total').textContent=0}</script></body></html>
